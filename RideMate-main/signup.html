<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RideMate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html">RideMate</a></div>
            <ul class="nav-links">
                <li><a href="index.html#ride">Ride</a></li>
                <li><a href="index.html#drive">Drive</a></li>
                <li><a href="index.html#business">Business</a></li>
            </ul>
            <div class="header-right">
                <a href="login.html" class="login-btn">Log in</a>
            </div>
        </nav>
    </header>
    <main class="auth-container">
        <div class="auth-box">
            <h1>Create your account</h1>
            <form id="signup-form">
                <div class="input-group">
                    <input type="text" id="name" placeholder="Full name" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="auth-btn">Sign up</button>
                <div id="otp-section" style="display: none;">
                    <div class="input-group">
                        <input type="text" id="otp" placeholder="Enter OTP">
                    </div>
                    <button type="button" id="verify-otp-btn" class="auth-btn">Verify OTP</button>
                </div>
                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
            </form>
        </div>
    </main>
    <script src="auth.js"></script>
</body>
</html>
