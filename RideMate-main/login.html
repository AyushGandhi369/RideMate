<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RideMate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html">RideMate</a></div>
            <ul class="nav-links">
                <li><a href="index.html#ride">Ride</a></li>
                <li><a href="index.html#drive">Drive</a></li>
                <li><a href="index.html#business">Business</a></li>
            </ul>
            <div class="header-right">
                <a href="signup.html" class="signup-btn">Sign up</a>
            </div>
        </nav>
    </header>
    <main class="auth-container">
        <div class="auth-box">
            <h1>Welcome back</h1>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="auth-btn">Log in</button>
                <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
            </form>
        </div>
    </main>
    <script src="auth.js"></script>
</body>
</html>
